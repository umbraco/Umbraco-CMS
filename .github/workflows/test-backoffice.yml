name: Test Backoffice

on:
  push:
    branches:
      - main
      - release/*
      - v*/dev
      - v*/main
    paths:
      - src/Umbraco.Web.UI.Client/**
      - src/**/OpenApi.json
      - .github/workflows/test-backoffice.yml
  pull_request:
    branches:
      - main
      - release/*
      - v*/dev
      - v*/main
    paths:
      - src/Umbraco.Web.UI.Client/**
      - src/**/OpenApi.json
      - .github/workflows/test-backoffice.yml

  # Allows GitHub to use this workflow to validate the merge queue
  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  NODE_OPTIONS: --max_old_space_size=16384

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Umbraco.Web.UI.Client
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/Umbraco.Web.UI.Client/.nvmrc
          cache: npm
          cache-dependency-path: ./src/Umbraco.Web.UI.Client/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Check for circular dependencies
        run: node devops/circular/index.js src
      - run: npm run lint:errors
      - run: npm run generate:tsconfig
      - run: npm run generate:icons
      - run: npm run build:for:cms
      - run: npm run check:paths
      - run: npm run generate:jsonschema:dist

  verify-generated-clients:
    name: Verify generated API clients
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Umbraco.Web.UI.Client
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/Umbraco.Web.UI.Client/.nvmrc
          cache: npm
          cache-dependency-path: ./src/Umbraco.Web.UI.Client/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline

      # Which clients exist differs per branch, so every workspace declaring the script is run
      # rather than naming them here. The generated files are deleted first because openapi-ts
      # reports success for a schema it could only partly resolve, and can then leave the
      # previous output in place: missing files fail the check below, stale ones would pass it.
      - name: Regenerate the API clients from the committed schemas
        run: |
          grep -rl --exclude-dir=node_modules 'auto-generated by @hey-api/openapi-ts' src \
            | while IFS= read -r file; do rm -f "$file"; done
          npm run generate:server-api --workspaces --if-present

      - name: Check the generated clients against the committed ones
        run: |
          drift=$(git status --porcelain -- .)
          if [ -n "$drift" ]; then
            echo "::error::A generated API client no longer matches the OpenApi.json it is generated from. Run 'npm --prefix src/Umbraco.Web.UI.Client run generate:server-api --workspaces --if-present' and commit the result."
            echo "$drift"
            git --no-pager diff -- .
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Umbraco.Web.UI.Client
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/Umbraco.Web.UI.Client/.nvmrc
          cache: npm
          cache-dependency-path: ./src/Umbraco.Web.UI.Client/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npx playwright install --with-deps
      - run: npm test
