parameters:
  - name: pipeline # pipeline resource alias to download the artifact from
    type: string
  - name: artifactName # "npm" or "npm-testhelpers"
    type: string
  - name: registry # scoped-registry URL to publish to
    type: string
  - name: customEndpoint # npmAuthenticate service connection(s)
    type: string
  - name: displayName # label for the publish step
    type: string
  - name: npmTag # dist-tag to publish under
    type: string
    default: latest
  - name: dryRun # download and prepare the package, but don't authenticate or publish
    type: boolean
    default: false

steps:
  - checkout: none
  - download: ${{ parameters.pipeline }}
    artifact: ${{ parameters.artifactName }}
  - bash: npm config set @umbraco-cms:registry "$REGISTRY_URL" --location=project
    displayName: Add scoped registry to .npmrc
    workingDirectory: $(Pipeline.Workspace)/${{ parameters.pipeline }}/${{ parameters.artifactName }}
    env:
      REGISTRY_URL: ${{ parameters.registry }}
  - ${{ if parameters.dryRun }}:
      - bash: for package in *.tgz; do echo "Would publish $package to $REGISTRY_URL with the $NPM_TAG dist-tag"; done
        displayName: List packages (dry run)
        workingDirectory: $(Pipeline.Workspace)/${{ parameters.pipeline }}/${{ parameters.artifactName }}
        env:
          REGISTRY_URL: ${{ parameters.registry }}
          NPM_TAG: ${{ parameters.npmTag }}
  - ${{ else }}:
      - task: npmAuthenticate@0
        displayName: Authenticate with npm
        inputs:
          workingFile: $(Pipeline.Workspace)/${{ parameters.pipeline }}/${{ parameters.artifactName }}/.npmrc
          customEndpoint: ${{ parameters.customEndpoint }}
      - bash: npm publish *.tgz --tag "$NPM_TAG"
        displayName: ${{ parameters.displayName }}
        workingDirectory: $(Pipeline.Workspace)/${{ parameters.pipeline }}/${{ parameters.artifactName }}
        env:
          NPM_TAG: ${{ parameters.npmTag }}
